name: Windows CI

on:
  workflow_dispatch:
    inputs:
      build_portable:
        description: Build and verify the Windows portable package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      REQUIRE_QWEN_CLI: '1'
      QWEN_USAGE_STATISTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.lock.txt ./vendor/qwen-code-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix gui --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test business, Agent, MCP and source packaging
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Type-check and build frontend
        run: npm run build --prefix gui
      - name: Fetch Microsoft offline prerequisite
        if: github.event_name == 'workflow_dispatch' && inputs.build_portable
        shell: pwsh
        run: ./scripts/fetch_webview2.ps1
      - name: Build portable application
        if: github.event_name == 'workflow_dispatch' && inputs.build_portable
        run: python scripts/build.py
      - name: Verify packaged MCP export
        if: github.event_name == 'workflow_dispatch' && inputs.build_portable
        run: python scripts/smoke_frozen_mcp.py
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-report
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain portable build
        if: success() && github.event_name == 'workflow_dispatch' && inputs.build_portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExcelAssistant-Windows-x64
          path: build/ExcelAssistant/
          if-no-files-found: error
          retention-days: 14
