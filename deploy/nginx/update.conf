# Excel 数据助手 · 内网更新服务示例配置
# Windows nginx：放入 nginx/conf/conf.d/，并在 nginx.conf 的 http{} 里 include conf.d/*.conf;
# Linux：放入 /etc/nginx/conf.d/。
# 把发布产物（latest.json + ExcelAssistant-<版本>-win64.zip）放到 root 指向的目录。

server {
    listen       80;
    server_name  update.example.local;   # 改为实际内网主机名或 IP

    root   D:/updates/ExcelAssistant;    # 更新根目录（IT 用文件共享/rsync 放包）
    index  latest.json;

    charset utf-8;

    # 版本清单：禁止缓存，保证客户端每次取到最新版本
    location = /latest.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma no-cache;
        expires -1;
    }

    # 安装包 / 校验文件：文件名带版本号、内容不可变，可长缓存
    location ~* \.(zip|sha256)$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 目录浏览（可选，方便 IT 人工核对历史版本）
    location / {
        autoindex on;
        autoindex_exact_size off;
    }

    # 访问日志：审计「谁、何时、下载了哪个版本」
    access_log logs/excelassistant-update.access.log;
    error_log  logs/excelassistant-update.error.log;

    # 可选：仅允许内网网段（按实际网段放开）
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny  all;
}
